[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-gizmosql"
version = "1.12.1"
description = "The GizmoSQL adapter plugin for dbt"
readme = "README.md"
authors = [{ name = "Philip Moore", email = "philip@gizmodata.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["dbt", "gizmosql", "flightsql", "duckdb", "adbc", "gizmodata"]
dependencies = [
  "dbt-core~=1.12.0",
  "dbt-common~=1.38.0",
  "dbt-adapters~=1.24.5",
  "adbc-driver-gizmosql>=2.0.8",
  "duckdb>=1.5.5",
  "pandas>=3.0.0"
]
[project.optional-dependencies]
dev = [
    "pip-tools",
    "pytest",
    "dbt-tests-adapter==1.20.*",
    "black==26.5.1",
    "bumpversion",
    "flake8",
    "flaky",
    "freezegun==1.5.5",
    "ipdb",
    "mypy==2.3.0",
    "pre-commit",
    "pytest-csv",
    "pytest-xdist",
    "pytz",
    "tox>=4.58",
    "twine",
    "wheel",
    "gizmosql",
    "docker"
]

[project.urls]
Homepage = "https://github.com/gizmodata/dbt-gizmosql"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
include = ["dbt", "dbt.*"]

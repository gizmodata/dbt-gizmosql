[tox]
envlist = py311,py312,py313,py314

[testenv]
description = unit + functional tests (starts a GizmoSQL server subprocess; the S3 test needs Docker)
extras = dev
passenv =
    DBT_*
    PYTEST_ADDOPTS
commands = {envpython} -m pytest {posargs} tests

[testenv:unit]
description = unit tests only (no server needed)
commands = {envpython} -m pytest {posargs} tests/unit
